openapi: 3.0.3
info:
  title: InsightConnect API Guide
  description: "<p>Welcome to the reference documentation for the public APIs available for InsightConnect.</p>\n\t\t<p>Here are a few resources to help you learn how to start using our APIs:</p>\n\t\t<ul>\n\t\t<li><a href='https://insight.help.rapid7.com/docs/api-overview'>Learn about basic concepts and capabilities</a></li>\n\t\t<li><a href='https://insight.help.rapid7.com/docs/managing-platform-api-keys'>Get an Insight platform API key to set up authentication</a></li>\n\t\t<li><a href='https://insight.help.rapid7.com/docs/product-apis'>See available Insight product APIs</a></li>\n\t\t<li><a href='https://docs.rapid7.com/insight/product-apis/#supported-regions'>Learn about available API regions</a></li>\n\t\t<li><a href='https://insightconnect.help.rapid7.com/docs'>Learn more about InsightConnect</a></li>\n\t\t</ul>\n\t\t<p>After you’ve got the basics down, you can use this API guide to find examples of requests and responses.</p>"
  contact:
    name: Rapid7 Support
    url: https://support.rapid7.com
    email: support@rapid7.com
  version: '1.0'
servers:
  - url: https://{region}.api.insight.rapid7.com/
    variables:
      region:
        enum:
          - us
          - us2
          - us3
          - eu
          - ca
          - ap
          - au
        default: us
tags:
  - name: Custom Plugins
    description: These endpoints facilitate custom plugin operations.
  - name: Global Artifacts
    description: This service deals with actions associated with Global Artifacts.
  - name: Global Artifacts Entities
    description: This service deals with actions associated with Global Artifact Entities.
  - name: Jobs
    description: These endpoints facilitate job operations.
  - name: Snippet
    description: These endpoints facilitate snippet operations.
  - name: Workflow
    description: These endpoints facilitate workflow operations.
  - name: Workflow Execution
    description: These endpoints facilitate workflow execution operations.
paths:
  /connect/v1/customPlugins/import:
    post:
      tags:
        - Custom Plugins
      summary: Import Custom Plugins
      description: |-
        Upload a custom plugin to be used with workflows. This request requires both the plugin tar ball and the specification file.

        How to create a custom plugin: https://docs.rapid7.com/insightconnect/create-custom-plugins
      operationId: Custom Plugins#Import
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequestBody'
            example:
              specification: []
              tar: []
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginResult'
              example:
                data:
                  plugin:
                    cacheEnabled: false
                    cloudEnabled: false
                    connectionVersion: 0
                    containerImage: mypluginimage
                    createdAt: '2022-06-15T16:08:08.254416Z'
                    createdById: 248855d2-d2e1-4616-8f7a-dcb992888e33
                    description: This is my first custom plugin
                    iconUrl: ''
                    id: e78196ee-664a-4309-91b0-8b891c368b02
                    imageData: ''
                    installedAt: '2022-06-15T16:08:08.254416Z'
                    installedById: a28966f2-5e84-4175-854e-52d67a953a3c
                    isInstalled: true
                    isPublic: true
                    name: my_custom_plugin
                    pluginSource: custom
                    pluginSpecVersion: 1.0.0
                    resources:
                      vendor_url: https://www.virustotal.com
                    spec: ''
                    tags:
                      - phishing
                      - ticketing
                    title: My Custom Plugin
                    types:
                      - trigger_plugin
                    updatedAt: '2022-06-15T16:08:08.254416Z'
                    updatedById: 8a21368a-9bb6-4a05-8c5a-938502e8f9da
                    vendor: foo
                    version: 1.0.0
        '400':
          description: 'BadRequestErr: Missing specification or plugin file'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '401':
          description: 'Unauthorized: Unauthorized error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '500':
          description: 'InternalServer: Internal error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
  /connect/v1/execute/async/workflows/{workflowId}:
    post:
      tags:
        - Workflow Execution
      summary: Execute a Workflow
      description: Executes the active version associated with given workflowId.
      operationId: Workflow Execution#Execute
      parameters:
        - name: workflowId
          in: path
          description: The unique ID of the workflow
          required: true
          schema:
            type: string
            description: The unique ID of the workflow
            example: 316bf4eb-f979-4c4e-a1ce-0bf399cb0b90
            format: uuid
          example: 316bf4eb-f979-4c4e-a1ce-0bf399cb0b90
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleWorkflowExecution'
              example:
                error:
                  details: {}
                  errorCode: '500'
                  message: Test message
                  requestId: dbfb9b21-32c8-4082-8649-70b43d449ca8
        '500':
          description: 'InternalServer: Internal error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
  /connect/v1/globalArtifacts:
    get:
      tags:
        - Global Artifacts
      summary: Get Global Artifacts
      description: Gets all global artifacts based on the given filters, limits and offsets. A maximum of 30 global artifacts will be returned this way.
      operationId: Global Artifacts#List
      parameters:
        - name: limit
          in: query
          description: The number of global artifacts to retrieve. Maximum value is 30, minimum is 0.
          allowEmptyValue: true
          schema:
            type: integer
            description: The number of global artifacts to retrieve. Maximum value is 30, minimum is 0.
            default: 30
            example: 10
            minimum: 0
            maximum: 30
          example: 10
        - name: offset
          in: query
          description: The (zero-based) offset of the first item in the collection to return.
          allowEmptyValue: true
          schema:
            type: integer
            description: The (zero-based) offset of the first item in the collection to return.
            default: 0
            example: 10
            format: int64
          example: 10
        - name: sortBy
          in: query
          description: Global artifact property to sort the responses by. The only option available now is 'name', and it is set by default.
          allowEmptyValue: true
          schema:
            type: string
            description: Global artifact property to sort the responses by. The only option available now is 'name', and it is set by default.
            default: name
            example: name
          example: name
        - name: sortOrder
          in: query
          description: The sort order for the property given in sortBy. Options are 'asc' and 'desc'
          allowEmptyValue: true
          schema:
            type: string
            description: The sort order for the property given in sortBy. Options are 'asc' and 'desc'
            example: desc
            enum:
              - asc
              - desc
          example: asc
        - name: filterText
          in: query
          description: Filter text to apply to a global artifact's name. Case insensitive.
          allowEmptyValue: true
          schema:
            type: string
            description: Filter text to apply to a global artifact's name. Case insensitive.
            example: IP Allowlist
          example: IP Allowlist
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalArtifactListResponseModel'
              example:
