  /connect/v1/globalArtifacts/{globalArtifactId}:
    delete:
      tags:
        - Global Artifacts
      summary: Delete a Global Artifact
      description: Deletes a global artifact based on the given ID. This also deletes its entities. This API will fail with 409 Conflict if the global artifact is in use in workflows.
      operationId: Global Artifacts#Delete
      parameters:
        - name: globalArtifactId
          in: path
          description: ID of global artifact to return.
          required: true
          schema:
            type: string
            description: ID of global artifact to return.
            example: f0c84a4f-3005-41f1-a752-06a4af256c33
            format: uuid
          example: f0c84a4f-3005-41f1-a752-06a4af256c33
      responses:
        '204':
          description: No Content response.
        '401':
          description: 'Unauthorized: Unauthorized error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '409':
          description: 'Global Artifact Conflict: Conflict response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '500':
          description: 'InternalServer: Internal error'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
    get:
      tags:
        - Global Artifacts
      summary: Get Single Global Artifact
      description: Gets a single global artifacts by the specified ID
      operationId: Global Artifacts#Get Single
      parameters:
        - name: globalArtifactId
          in: path
          description: ID of global artifact to return.
          required: true
          schema:
            type: string
            description: ID of global artifact to return.
            example: f0c84a4f-3005-41f1-a752-06a4af256c33
            format: uuid
          example: f0c84a4f-3005-41f1-a752-06a4af256c33
      responses:
        '200':
          description: OK response.
          content:
