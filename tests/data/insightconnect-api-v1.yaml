  /connect/v2/workflows/{workflowId}/activate:
    post:
      tags:
        - Workflow
      summary: Activate Workflow
      description: 'Activate a workflow using the workflowID. Response includes the latest published version of the workflow, and any unpublished changes that have been made to the workflow. If the workflow is already active without any unpublished changes, this will error as the workflow is already active. If the workflow is inactive without any unpublished changes, this will reactivate the inactive workflow. If the workflow has an active version and unpublished changes, the unpublished changes will be published and activated. If the workflow has an inactive version and unpublished changes, the unpublished changes will be published and activated; to bypass publishing unpublished changes on activate, set the `reactivate` query parameter to `true` and this will reactivate the inactive published version. NOTE: This endpoint requires a User API Key for authentication.'
      operationId: Workflow#Activate
      parameters:
        - name: reactivate
          in: query
          description: Optional parameter to reactivate a workflow in the case where you have a published inactive version and unpublished changes.
          allowEmptyValue: true
          schema:
            type: boolean
            description: Optional parameter to reactivate a workflow in the case where you have a published inactive version and unpublished changes.
            default: false
            example: false
          example: true
        - name: workflowId
          in: path
          description: The unique ID of the workflow
          required: true
          schema:
            type: string
            description: The unique ID of the workflow
            example: 316bf4eb-f979-4c4e-a1ce-0bf399cb0b90
            format: uuid
          example: 316bf4eb-f979-4c4e-a1ce-0bf399cb0b90
      responses:
        '200':
          description: OK response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateWorkflow'
              example:
                data:
                  publishedVersion:
