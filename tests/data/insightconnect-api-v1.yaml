  /connect/v1/globalArtifacts/{globalArtifactId}/entities:
    get:
      tags:
        - Global Artifacts Entities
      summary: Get Entities for Global Artifact
      description: Gets a paginated list of entities for the given global artifact ID. Ordering by most newly created entity is forced.
      operationId: Global Artifacts Entities#Entities
      parameters:
        - name: globalArtifactId
          in: path
          description: The unique ID of the Global Artifact.
          required: true
          schema:
