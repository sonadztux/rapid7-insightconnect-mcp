[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rapid7-insightconnect-mcp"
version = "0.1.0"
description = "Local stdio MCP server for Rapid7 InsightConnect / Automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "httpx>=0.28,<1", "pydantic>=2.11,<3"]

[project.scripts]
rapid7-insightconnect-mcp = "insightconnect_mcp.cli:main"

# Allowlist, not the default "everything not gitignored": local client configs and
# scratch files in the checkout can hold absolute host paths or credentials.
[tool.hatch.build.targets.sdist]
include = ["/insightconnect_mcp", "/tests", "/README.md", "/pyproject.toml", "/uv.lock"]

[tool.hatch.build.targets.wheel]
packages = ["insightconnect_mcp"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "mypy>=1.15,<2", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90", "S"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["insightconnect_mcp"]
