[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rapid7-insightconnect-mcp"
version = "0.2.1"
description = "Local, safety-first MCP server for Rapid7 InsightConnect / Automation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
keywords = ["mcp", "model-context-protocol", "rapid7", "insightconnect", "security-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.0,<2",
    "fastmcp>=2.0,<3",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "pip-audit>=2.9,<3",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-httpx>=0.35,<1",
    "ruff>=0.8,<1",
]

[project.scripts]
rapid7-insightconnect-mcp = "insightconnect_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["insightconnect_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/insightconnect_mcp",
    "/tests",
    "/README.md",
    "/LICENSE.md",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/RELEASING.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["insightconnect_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]
ignore = ["S101"]
