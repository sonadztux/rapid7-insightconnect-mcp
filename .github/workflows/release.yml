name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Resolve and validate release tag
        shell: bash
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          print(tomllib.loads(Path('pyproject.toml').read_text())['project']['version'])
          PY
          )"
          test -n "${VERSION}"
          TAG="v${VERSION}"
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"
      - name: Refuse an existing tag or release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists" >&2
            exit 1
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists" >&2
            exit 1
          fi
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes
      - name: Dispatch trusted PyPI publishing on the release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh workflow run publish.yml --ref "${TAG}"; then
              exit 0
            fi
            echo "Publish dispatch attempt ${attempt} failed; retrying..." >&2
            sleep 2
          done
          exit 1
