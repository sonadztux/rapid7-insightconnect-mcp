name: restore-lock-021

on:
  push:
    branches: [fix/first-run-ux]
    paths:
      - .github/workflows/restore-lock-021.yml

permissions:
  contents: write

jobs:
  restore-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/first-run-ux
          fetch-depth: 0
      - name: Restore main resolution with only the root version changed
        shell: bash
        run: |
          git show origin/main:uv.lock > /tmp/main-uv.lock
          python - <<'PY'
          from pathlib import Path

          base = Path('/tmp/main-uv.lock').read_text()
          old = 'name = "rapid7-insightconnect-mcp"\nversion = "0.2.0"'
          new = 'name = "rapid7-insightconnect-mcp"\nversion = "0.2.1"'
          if base.count(old) != 1:
              raise SystemExit('expected exactly one 0.2.0 root package entry in main uv.lock')
          Path('uv.lock').write_text(base.replace(old, new, 1))
          PY
          grep -A2 '^name = "rapid7-insightconnect-mcp"$' uv.lock | grep -q '^version = "0.2.1"$'
      - name: Commit patch-only lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: keep 0.2.1 lockfile patch-only"
          git push origin HEAD:fix/first-run-ux
