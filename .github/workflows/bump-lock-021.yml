name: bump-lock-021

on:
  push:
    branches: [fix/first-run-ux]
    paths:
      - .github/workflows/bump-lock-021.yml

permissions:
  contents: write

jobs:
  bump-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/first-run-ux
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.7"
      - name: Regenerate lockfile
        run: |
          test "$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text())['project']['version'])
          PY
          )" = "0.2.1"
          uv lock
          grep -A2 '^name = "rapid7-insightconnect-mcp"$' uv.lock | grep -q '^version = "0.2.1"$'
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already matches pyproject.toml"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh lockfile for 0.2.1"
          git push origin HEAD:fix/first-run-ux
